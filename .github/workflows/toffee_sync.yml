name: Toffee Category Auto-Sync & Database Update

on:
  workflow_dispatch:

concurrency:
  group: toffee-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-toffee:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Toffee Playlists & Update Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hqmhuvsjlykrdusfkmeg.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_SECRET_TOKEN: ${{ secrets.ADMIN_SECRET_TOKEN || 'GoLiveAdminSecret2026' }}
          PLAYLISTS_DIR: playlists
          OUTPUT_DIR: output
        run: |
          python scripts/sync_toffee.py

      - name: Build Combined Multi-Source M3U & JSON
        env:
          CHANNELS_JSON_PATH: output/channels.json
          TOFFEE_JSON_PATH: output/toffee.json
          OUTPUT_DIR: output
        run: |
          python scripts/combine_playlists.py

      - name: Commit and push updated Toffee artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlists/toffee.m3u output/toffee.json output/combined.m3u output/combined.json
          if ! git diff --staged --quiet; then
            git commit -m "auto: update toffee playlist & supabase [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes detected across Toffee playlist and output."
          fi
