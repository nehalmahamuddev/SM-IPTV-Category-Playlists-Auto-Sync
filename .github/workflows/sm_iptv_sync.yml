name: SM IPTV Category Playlists Auto-Sync

on:
  schedule:
    # Runs every 20 minutes on off-peak marks (:05, :25, :45) to avoid GitHub runner queue congestion
    - cron: '5,25,45 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync, sync_sm_iptv]
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'requirements.txt'

concurrency:
  group: sm-iptv-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-category-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Raw Category Playlists & Catalog
        env:
          PLAYLISTS_DIR: playlists
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python scripts/generate_category_playlists.py

      - name: Refine Playlists & Build Multi-Stream Output
        env:
          RAW_PLAYLISTS_DIR: playlists
          REFINED_OUTPUT_DIR: output
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python scripts/refine_playlists.py

      - name: Sync Refined Channels & Multi-Stream Servers to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hqmhuvsjlykrdusfkmeg.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_SECRET_TOKEN: ${{ secrets.ADMIN_SECRET_TOKEN || 'GoLiveAdminSecret2026' }}
        run: |
          python scripts/sync_output_to_supabase.py

      - name: Commit and push updated playlists and refined output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlists/ output/
          if ! git diff --staged --quiet; then
            git commit -m "auto: update raw playlists & refined multi-stream output [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes detected across playlists and output."
          fi
